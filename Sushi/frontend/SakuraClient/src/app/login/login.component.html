<div class="min-h-screen w-full flex items-center justify-center p-4 sm:p-6 relative overflow-hidden bg-[#FBF6EC]">
    
    <!-- FONDO SAKURA SUAVE -->
    <div class="absolute inset-0 opacity-20 pointer-events-none bg-repeat" style="background-image: url('https://i.postimg.cc/xCQnm8hw/Gemini-Generated-Image-uax6osuax6osuax6.jpg');"></div>

    <!-- DEGRADADO CÁLIDO ESTILO PORTADA -->
    <div class="absolute inset-0 bg-gradient-to-r from-[#FBF6EC] via-[#FBF6EC]/85 to-[#F3BCC4]/25 pointer-events-none"></div>

    <!-- Contenedor Principal tipo Tarjeta Ejecutiva Dividida -->
    <div class="max-w-5xl w-full bg-[#FFFFFF] rounded-[2.5rem] shadow-2xl border-2 grid grid-cols-1 md:grid-cols-12 overflow-hidden relative z-10" style="border-color: #F3ECDA;">
        
        <!-- COLUMNA IZQUIERDA: IMAGEN EN GRANDE SIN TEXTO -->
        <div class="hidden md:block md:col-span-5 relative overflow-hidden bg-[#FDECEB] border-r-2" style="border-color: #F3ECDA;">
            <img src="https://img.freepik.com/premium-photo/set-yummy-sushi_1041953-8853.jpg" alt="Hanami Sushi" class="w-full h-full object-cover">
        </div>

        <!-- COLUMNA DERECHA: FORMULARIO DE ACCESO Y REGISTRO -->
        <div class="md:col-span-7 p-6 sm:p-10 flex flex-col justify-center space-y-6 bg-[#FFFFFF]">
            
            <!-- Encabezado / Título -->
            <div class="text-center md:text-left space-y-2">
                <div class="flex items-center justify-center md:justify-start gap-3">
                    <img src="https://i.postimg.cc/7CC88vGF/Gemini-Generated-Image-h4dv76h4dv76h4dv.jpg" alt="Logo Hanami" class="h-11 w-auto object-contain rounded-xl border p-0.5 bg-[#FBF6EC] shrink-0" style="border-color: #F3ECDA;">
                    <div>
                        <span class="text-[10px] font-black tracking-[0.2em] uppercase text-[#E3632C] block leading-none">
                            BIENVENIDO A HANAMI
                        </span>
                        <h1 class="font-hoshiko text-4xl sm:text-5xl font-bold tracking-wide leading-tight" style="color: #4A1A26;">Hanami Sushi</h1>
                    </div>
                </div>
                <p class="text-xs text-gray-600 font-medium">Inicia sesión o regístrate para acceder a tus beneficios y pedidos.</p>
            </div>
            
            <!-- Pestañas de Alternancia (Iniciar Sesión / Registrarse) -->
            <div class="flex rounded-2xl p-1 bg-[#FBF6EC] border" style="border-color: #F3ECDA;">
                <button (click)="isRegisterMode = false" [style.background-color]="!isRegisterMode ? '#E3632C' : 'transparent'" [style.color]="!isRegisterMode ? '#FFFFFF' : '#4A1A26'" class="flex-1 py-2.5 rounded-xl text-xs font-extrabold shadow-sm transition">
                    Iniciar Sesión
                </button>
                <button (click)="isRegisterMode = true" [style.background-color]="isRegisterMode ? '#E3632C' : 'transparent'" [style.color]="isRegisterMode ? '#FFFFFF' : '#4A1A26'" class="flex-1 py-2.5 rounded-xl text-xs font-extrabold transition">
                    Registrarse
                </button>
            </div>

            <!-- FORMULARIO DE INICIO DE SESIÓN -->
            <div *ngIf="!isRegisterMode" class="space-y-4 text-xs font-bold" style="color: #4A1A26;">
                <div>
                    <label class="block mb-1.5">Correo Electrónico</label>
                    <input type="email" [(ngModel)]="loginEmail" placeholder="ej. cliente@hanami.com" class="w-full px-4 py-3 rounded-xl bg-[#FBF6EC] border text-xs text-gray-800 font-normal shadow-sm focus:outline-none focus:border-[#E3632C]" style="border-color: #F3ECDA;">
                </div>
                <div>
                    <label class="block mb-1.5">Contraseña</label>
                    <input type="password" [(ngModel)]="loginPassword" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-[#FBF6EC] border text-xs text-gray-800 font-normal shadow-sm focus:outline-none focus:border-[#E3632C]" style="border-color: #F3ECDA;">
                </div>

                <button (click)="handleLogin()" class="w-full py-3.5 rounded-xl text-white font-black text-sm shadow-lg transition hover:bg-[#4A1A26] mt-2" style="background-color: #E3632C;">
                    Ingresar al Sistema ➔
                </button>

                <!-- Accesos rápidos informativos -->
                <div class="bg-[#FDECEB] p-3.5 rounded-2xl border text-[11px] text-[#4A1A26] space-y-2" style="border-color: #F3BCC4;">
                    <p class="font-bold text-center text-[#E3632C] uppercase tracking-wider text-[10px]">Accesos Rápidos Base de Datos:</p>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-1.5 text-[10px] text-center font-mono">
                        <span class="bg-[#FFFFFF] p-1.5 rounded-xl border text-[#4A1A26]" style="border-color: #F3ECDA;">Admin:<br><b>administrador@hanami.com</b></span>
                        <span class="bg-[#FFFFFF] p-1.5 rounded-xl border text-[#4A1A26]" style="border-color: #F3ECDA;">Cocina:<br><b>cocina@hanami.com</b></span>
                        <span class="bg-[#FFFFFF] p-1.5 rounded-xl border text-[#4A1A26]" style="border-color: #F3ECDA;">Cliente:<br><b>cliente@hanami.com</b></span>
                    </div>
                </div>
            </div>

            <!-- FORMULARIO DE REGISTRO COMPLETO (CONECTADO A MYSQL) -->
            <div *ngIf="isRegisterMode" class="space-y-3 text-xs font-bold max-h-[50vh] overflow-y-auto pr-1" style="color: #4A1A26;">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block mb-1">Nombre *</label>
                        <input type="text" [(ngModel)]="regName" placeholder="Tu nombre" class="w-full px-3 py-2 rounded-xl bg-[#FBF6EC] border text-xs text-gray-800 font-normal focus:outline-none focus:border-[#E3632C]" style="border-color: #F3ECDA;">
                    </div>
                    <div>
                        <label class="block mb-1">Apellido *</label>
                        <input type="text" [(ngModel)]="regLastName" placeholder="Tu apellido" class="w-full px-3 py-2 rounded-xl bg-[#FBF6EC] border text-xs text-gray-800 font-normal focus:outline-none focus:border-[#E3632C]" style="border-color: #F3ECDA;">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block mb-1">Correo Electrónico *</label>
                        <input type="email" [(ngModel)]="regEmail" placeholder="correo@domain.com" class="w-full px-3 py-2 rounded-xl bg-[#FBF6EC] border text-xs text-gray-800 font-normal focus:outline-none focus:border-[#E3632C]" style="border-color: #F3ECDA;">
                    </div>
                    <div>
                        <label class="block mb-1">Contraseña *</label>
                        <input type="password" [(ngModel)]="regPassword" placeholder="Crea una clave" class="w-full px-3 py-2 rounded-xl bg-[#FBF6EC] border text-xs text-gray-800 font-normal focus:outline-none focus:border-[#E3632C]" style="border-color: #F3ECDA;">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block mb-1">Fecha de Nacimiento</label>
                        <input type="date" [(ngModel)]="regBirthDate" (change)="onBirthDateChange()" class="w-full px-3 py-2 rounded-xl bg-[#FBF6EC] border text-xs text-gray-800 font-normal focus:outline-none focus:border-[#E3632C]" style="border-color: #F3ECDA;">
                    </div>
                    <div>
                        <label class="block mb-1">Teléfono (10 dígitos) *</label>
                        <input type="tel" [(ngModel)]="regPhone" placeholder="4771234567" maxlength="10" class="w-full px-3 py-2 rounded-xl bg-[#FBF6EC] border text-xs text-gray-800 font-normal focus:outline-none focus:border-[#E3632C]" style="border-color: #F3ECDA;">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block mb-1">Género</label>
                        <select [(ngModel)]="regGender" class="w-full px-3 py-2 rounded-xl bg-[#FBF6EC] border text-xs text-gray-800 font-normal focus:outline-none focus:border-[#E3632C]" style="border-color: #F3ECDA;">
                            <option value="Femenino">Femenino</option>
                            <option value="Masculino">Masculino</option>
                            <option value="Otro">Otro</option>
                        </select>
                    </div>
                    <div>
                        <label class="block mb-1">Dirección *</label>
                        <input type="text" [(ngModel)]="regAddress" placeholder="Calle y número, León, Gto." class="w-full px-3 py-2 rounded-xl bg-[#FBF6EC] border text-xs text-gray-800 font-normal focus:outline-none focus:border-[#E3632C]" style="border-color: #F3ECDA;">
                    </div>
                </div>

                <button (click)="handleRegister()" class="w-full py-3.5 rounded-xl text-white font-black text-sm shadow-lg transition hover:bg-[#4A1A26] mt-2" style="background-color: #E3632C;">
                    Completar Registro en Base de Datos ➔
                </button>
            </div>

        </div>

    </div>

    <!-- TOAST DE NOTIFICACIONES -->
    <div *ngIf="showToastFlag" class="fixed bottom-5 right-5 z-50">
        <div class="px-4 py-3 rounded-2xl text-white text-xs font-extrabold shadow-2xl border-2 animate-bounce" style="background-color: #E3632C; border-color: #F3BCC4;">
            {{ toastMessage }}
        </div>
    </div>
</div>
