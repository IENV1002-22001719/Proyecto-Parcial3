<div class="min-h-screen w-full flex items-center justify-center p-4 sm:p-6 relative overflow-hidden bg-cover bg-center" style="background-image: url('https://i.postimg.cc/xCQnm8hw/Gemini-Generated-Image-uax6osuax6osuax6.jpg');">
    
    <!-- Capa de oscurecimiento suave para dar profundidad a la imagen trasera -->
    <div class="absolute inset-0 bg-black/25"></div>

    <!-- Elementos decorativos de fondo estilo oriental / sakura (Blur suave) -->
    <div class="absolute -top-32 -left-32 w-96 h-96 rounded-full bg-[#E4D4BA]/20 blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 rounded-full bg-[#781428]/20 blur-3xl pointer-events-none"></div>

    <!-- Contenedor Principal tipo Tarjeta Ejecutiva Dividida (Con transparencia alta para ver el fondo) -->
    <div class="max-w-5xl w-full bg-[#FAF5EC]/35 backdrop-blur-md rounded-[2.5rem] shadow-2xl border-4 grid grid-cols-1 md:grid-cols-12 overflow-hidden relative z-10" style="border-color: #E4D4BA;">
        
        <!-- COLUMNA IZQUIERDA: VITRINA VISUAL (LISAS, SIN PUNTOS) -->
        <div class="hidden md:flex md:col-span-5 p-8 flex-col justify-center relative bg-gradient-to-br from-[#781428]/90 to-[#5C0B1B]/90 text-white overflow-hidden backdrop-blur-sm space-y-6">
            
            <!-- Colage de Imagen Grande (Limpio y estilizado) -->
            <div class="relative z-10 w-full flex flex-col items-center justify-center space-y-4 my-auto">
                <div class="w-full h-64 sm:h-72 rounded-2xl overflow-hidden border-2 border-[#E4D4BA]/40 shadow-xl transform -rotate-2 hover:scale-105 transition duration-500">
                    <img src="https://img.freepik.com/premium-photo/set-yummy-sushi_1041953-8853.jpg" alt="Sushi Roll" class="w-full h-full object-cover">
                </div>

                <!-- Sello decorativo institucional -->
                <div class="w-full text-center bg-black/40 backdrop-blur-md py-2.5 rounded-xl border border-amber-200/30 text-[11px] font-bold text-amber-200 shadow-inner tracking-wider">
                    Sabor Legendario & Calidad
                </div>
            </div>

            <div class="relative z-10 text-[11px] text-amber-200/80 text-center font-bold tracking-wide">
                Hanami Sushi León Gto.
            </div>
        </div>

        <!-- COLUMNA DERECHA: FORMULARIO DE ACCESO Y REGISTRO -->
        <div class="md:col-span-7 p-6 sm:p-10 flex flex-col justify-center space-y-6 bg-white/80 backdrop-blur-xl">
            
            <!-- Encabezado / Título -->
            <div class="text-center md:text-left space-y-1">
                <div class="w-12 h-12 mx-auto md:mx-0 rounded-2xl bg-gradient-to-br from-[#781428] to-[#5C0B1B] text-amber-200 flex items-center justify-center text-sm font-black shadow-lg border-2" style="border-color: #E4D4BA;">
                    HS
                </div>
                <h1 class="font-hoshiko text-4xl sm:text-5xl font-bold tracking-wide" style="color: #5C0B1B;">Hanami Sushi</h1>
                <p class="text-xs text-gray-700 font-medium">Inicia sesión o regístrate para acceder a tus beneficios y pedidos.</p>
            </div>
            
            <!-- Pestañas de Alternancia (Iniciar Sesión / Registrarse) -->
            <div class="flex rounded-2xl p-1 bg-[#FAF5EC]/80 border border-[#E4D4BA]">
                <button (click)="isRegisterMode = false" [style.background-color]="!isRegisterMode ? '#5C0B1B' : 'transparent'" [style.color]="!isRegisterMode ? '#FFFDF9' : '#5C0B1B'" class="flex-1 py-2.5 rounded-xl text-xs font-extrabold shadow transition">
                    Iniciar Sesión
                </button>
                <button (click)="isRegisterMode = true" [style.background-color]="isRegisterMode ? '#5C0B1B' : 'transparent'" [style.color]="isRegisterMode ? '#FFFDF9' : '#5C0B1B'" class="flex-1 py-2.5 rounded-xl text-xs font-extrabold transition">
                    Registrarse
                </button>
            </div>

            <!-- FORMULARIO DE INICIO DE SESIÓN -->
            <div *ngIf="!isRegisterMode" class="space-y-4 text-xs font-bold" style="color: #5C0B1B;">
                <div>
                    <label class="block mb-1.5">Correo Electrónico</label>
                    <input type="email" [(ngModel)]="loginEmail" placeholder="ej. cliente@hanami.com" class="w-full px-4 py-3 rounded-xl bg-white/90 border-2 text-xs text-gray-800 font-normal shadow-sm focus:outline-none focus:border-[#781428]" style="border-color: #E4D4BA;">
                </div>
                <div>
                    <label class="block mb-1.5">Contraseña</label>
                    <input type="password" [(ngModel)]="loginPassword" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-white/90 border-2 text-xs text-gray-800 font-normal shadow-sm focus:outline-none focus:border-[#781428]" style="border-color: #E4D4BA;">
                </div>

                <button (click)="handleLogin()" class="w-full py-3.5 rounded-xl text-white font-black text-sm shadow-lg transition hover:bg-[#5C0B1B] mt-2" style="background-color: #781428;">
                    Ingresar al Sistema ➔
                </button>

                <!-- Accesos rápidos informativos -->
                <div class="bg-amber-50/90 p-3 rounded-xl border border-amber-200 text-[11px] text-amber-900 space-y-1">
                    <p class="font-bold text-center">Accesos Rápidos Base de Datos:</p>
                    <div class="grid grid-cols-3 gap-1 text-[10px] text-center font-mono">
                        <span class="bg-white p-1 rounded border border-amber-200">Admin:<br><b>administrador@hanami.com</b></span>
                        <span class="bg-white p-1 rounded border border-amber-200">Cocina:<br><b>cocina@hanami.com</b></span>
                        <span class="bg-white p-1 rounded border border-amber-200">Cliente:<br><b>cliente@hanami.com</b></span>
                    </div>
                </div>
            </div>

            <!-- FORMULARIO DE REGISTRO COMPLETO (CONECTADO A MYSQL) -->
            <div *ngIf="isRegisterMode" class="space-y-3 text-xs font-bold max-h-[50vh] overflow-y-auto pr-1" style="color: #5C0B1B;">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block mb-1">Nombre *</label>
                        <input type="text" [(ngModel)]="regName" placeholder="Tu nombre" class="w-full px-3 py-2 rounded-xl bg-white/90 border-2 text-xs text-gray-800 font-normal" style="border-color: #E4D4BA;">
                    </div>
                    <div>
                        <label class="block mb-1">Apellido *</label>
                        <input type="text" [(ngModel)]="regLastName" placeholder="Tu apellido" class="w-full px-3 py-2 rounded-xl bg-white/90 border-2 text-xs text-gray-800 font-normal" style="border-color: #E4D4BA;">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block mb-1">Correo Electrónico *</label>
                        <input type="email" [(ngModel)]="regEmail" placeholder="correo@domain.com" class="w-full px-3 py-2 rounded-xl bg-white/90 border-2 text-xs text-gray-800 font-normal" style="border-color: #E4D4BA;">
                    </div>
                    <div>
                        <label class="block mb-1">Contraseña *</label>
                        <input type="password" [(ngModel)]="regPassword" placeholder="Crea una clave" class="w-full px-3 py-2 rounded-xl bg-white/90 border-2 text-xs text-gray-800 font-normal" style="border-color: #E4D4BA;">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block mb-1">Fecha de Nacimiento</label>
                        <input type="date" [(ngModel)]="regBirthDate" (change)="onBirthDateChange()" class="w-full px-3 py-2 rounded-xl bg-white/90 border-2 text-xs text-gray-800 font-normal" style="border-color: #E4D4BA;">
                    </div>
                    <div>
                        <label class="block mb-1">Teléfono (10 dígitos) *</label>
                        <input type="tel" [(ngModel)]="regPhone" placeholder="4771234567" maxlength="10" class="w-full px-3 py-2 rounded-xl bg-white/90 border-2 text-xs text-gray-800 font-normal" style="border-color: #E4D4BA;">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block mb-1">Género</label>
                        <select [(ngModel)]="regGender" class="w-full px-3 py-2 rounded-xl bg-white/90 border-2 text-xs text-gray-800 font-normal" style="border-color: #E4D4BA;">
                            <option value="Femenino">Femenino</option>
                            <option value="Masculino">Masculino</option>
                            <option value="Otro">Otro</option>
                        </select>
                    </div>
                    <div>
                        <label class="block mb-1">Dirección *</label>
                        <input type="text" [(ngModel)]="regAddress" placeholder="Calle y número, León, Gto." class="w-full px-3 py-2 rounded-xl bg-white/90 border-2 text-xs text-gray-800 font-normal" style="border-color: #E4D4BA;">
                    </div>
                </div>

                <button (click)="handleRegister()" class="w-full py-3.5 rounded-xl text-white font-black text-sm shadow-lg transition hover:bg-[#5C0B1B] mt-2" style="background-color: #781428;">
                    Completar Registro en Base de Datos ➔
                </button>
            </div>

        </div>

    </div>

    <!-- TOAST DE NOTIFICACIONES -->
    <div *ngIf="showToastFlag" class="fixed bottom-5 right-5 z-50">
        <div class="px-4 py-3 rounded-2xl text-white text-xs font-extrabold shadow-2xl border-2 animate-bounce" style="background-color: #781428; border-color: #E4D4BA;">
            {{ toastMessage }}
        </div>
    </div>
</div>
